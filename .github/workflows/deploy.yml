name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Configure Git
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git config --global init.defaultBranch main
    
    - name: Clean install frontend dependencies
      run: |
        rm -rf node_modules package-lock.json
        npm install
    
    - name: Clean install backend dependencies
      run: |
        cd server
        rm -rf node_modules package-lock.json
        npm install
    
    - name: Build application
      run: |
        npm run build
      env:
        CI: false
        NODE_OPTIONS: --max_old_space_size=4096
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files
        path: build/
        retention-days: 1

  deploy-status:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Deployment Status
      run: |
        echo "✅ Build completed successfully!"
        echo "🚀 Portfolio is ready for deployment"
        echo ""
        echo "📋 Deployment Options:"
        echo "1. Render: https://render.com (Recommended)"
        echo "2. Netlify: https://netlify.com"  
        echo "3. Vercel: https://vercel.com"
        echo ""
        echo "🌍 Your URLs will be:"
        echo "Frontend: https://main-portfolio-lokesh.onrender.com"
        echo "Backend API: https://portfolio-backend-lokesh.onrender.com"