services:
  # Frontend (React App)
  - type: web
    name: portfolio-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend (Express API)
  - type: web
    name: portfolio-backend
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: portfolio-backend
          property: port
      - key: MONGODB_URI
        fromDatabase:
          name: portfolio-db
          property: connectionString

  # MongoDB Database
  - type: pserv
    name: portfolio-db
    env: docker
    dockerfilePath: ./Dockerfile.mongo